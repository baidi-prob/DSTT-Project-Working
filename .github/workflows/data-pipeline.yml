name: WeatherPipe Continuous Ingestion & Drift Monitoring

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly run every Monday at 06:00 UTC
  push:
    paths:
      - 'data/incoming/**'
  workflow_dispatch:

jobs:
  continuous-ingestion-and-drift:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Weekly Replay & Anomaly Quarantine Audit
      run: |
        python -c "
        import csv
        with open('results/continuous_replay_results.csv', 'r', encoding='utf-8') as f:
            rows = list(csv.DictReader(f))
        assert len(rows) == 4, 'Expected 4 weekly replay batches'
        wk3 = [r for r in rows if r['Week'] == 'Week 3'][0]
        assert 'Quarantined' in wk3['Status'], 'Corrupted Week 3 batch must be quarantined'
        for r in rows:
            print(f\"{r['Week']}: RMSE={r['Champion RMSE (°C)']} C | Status={r['Status']}\")
        print('Weekly Streaming Drift & Quarantine Audit Verified.')
        "

    - name: Upload Drift & Monitoring Reports
      uses: actions/upload-artifact@v4
      with:
        name: drift-and-replay-monitoring
        path: results/continuous_replay_results.csv
